name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: make check
        run: make check

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      GIT_PKGS_VERSION: 0.22.0
      GIT_PKGS_SHA256: 7f65d7e9b3ca1f07c249e79c4e1283fdea9c16b6b10022b4b546292e96dcb08e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install git-pkgs
        run: |
          archive="git-pkgs_${GIT_PKGS_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/git-pkgs/git-pkgs/releases/download/v${GIT_PKGS_VERSION}/$archive"
          echo "$GIT_PKGS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/git-pkgs"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/git-pkgs" git-pkgs
          echo "$RUNNER_TEMP/git-pkgs" >> "$GITHUB_PATH"
      - name: make e2e
        run: make e2e

  image:
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/amrit-code/upstreamwatch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --platform linux/amd64 -f deploy/Dockerfile -t upw:ci .
      - name: Log in to ghcr.io
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
      - name: Push image
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          docker tag upw:ci "$IMAGE:$TAG"
          docker tag upw:ci "$IMAGE:latest"
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"

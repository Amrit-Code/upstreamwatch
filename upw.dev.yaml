# upw.dev.yaml — local development config. Everything not set here takes its
# default; see deploy/upw.example.yaml for every key.
data_dir: ./data-dev
http:
  listen: 127.0.0.1:8080

targets:                               # public repositories, fetched without a token
  - slug: glow
    url: https://github.com/charmbracelet/glow
    auth: none
  - slug: cleo
    url: https://github.com/python-poetry/cleo
    auth: none
  - slug: naughtyattributes
    url: https://github.com/dbrizov/NaughtyAttributes
    auth: none
    unity: true
  - slug: upstreamwatch
    url: https://github.com/Amrit-Code/upstreamwatch
    auth: none

llm:
  enabled: false

notify:
  channels:
    - type: stdout
    # - type: discord_webhook
    #   url: ${UPW_WEBHOOK_URL}
